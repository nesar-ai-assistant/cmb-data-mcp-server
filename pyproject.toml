[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmb-data-mcp-server"
version = "0.1.0"
description = "MCP server for public CMB power spectra (Planck PR3, ACT DR6, SPT-3G), lensing bandpowers and parameter chains"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "pydantic>=2,<3",
    "numpy",
    "scipy",
    "matplotlib>=3.8",
    "getdist>=1.5",
    "sacc>=0.12",
]

[project.optional-dependencies]
dev = ["pytest", "anyio", "ruff"]
theory = ["camb>=1.5"]  # optional: compute_lcdm_theory_spectrum with custom params (lazy import)
# hpc = ["hep-genesis[iri]"]  # server-side dispatch: pip install -e <hep-genesis-agent>/backend[iri]

[tool.mcp-server]
name = "CMB Data MCP Server"
skill_prefix = "cmb"
instructions_file = "mcp_server/INSTRUCTIONS.md"
tool_modules = [
    "tools.meta",
    "tools.spectra.tools",
    "tools.chains.tools",
    "mcp_server.dispatch",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*", "tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["network: needs internet (deselect with -m 'not network')"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]
